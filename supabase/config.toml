# ---------------------------------------------------------------------------
# Configuração de DESENVOLVIMENTO LOCAL (supabase start / Docker).
# Nada aqui afeta o projeto hospedado: são apenas as portas e serviços que o
# Supabase CLI sobe na máquina do desenvolvedor.
# ---------------------------------------------------------------------------

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Caixa de e-mail local (nada sai para a internet).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = [
  "http://127.0.0.1:8080",
  "http://localhost:8080",
  "http://127.0.0.1:8080/auth/callback",
  "http://localhost:8080/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Somente no ambiente local: evita depender de provedor de e-mail offline.
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Funções sem verificação de JWT no ambiente local (espelha o comportamento
# gerenciado em produção para endpoints públicos).
[functions.health]
verify_jwt = false

[functions.indexnow-ping]
verify_jwt = false

[functions.og-preview]
verify_jwt = false

[functions.aggregate-rating]
verify_jwt = false

[functions.os-consulta]
verify_jwt = false

[functions.os-codigo]
verify_jwt = false

[functions.os-stream]
verify_jwt = false

[functions.ors-route]
verify_jwt = false

[functions.og-validate-cities]
verify_jwt = false

[functions.telemetry-maintenance]
verify_jwt = false

[functions.mcp]
verify_jwt = false
