# Checklist automatizado de pós-deploy (robots, sitemaps, canonical/og:url,
# CTAs e erros de console) contra a URL publicada.
#
# Disparos:
#   • manual (workflow_dispatch, com base configurável)
#   • repository_dispatch com event_type = site-published (após cada release)
#   • diário às 09:10 UTC como rede de segurança
name: Pós-deploy — checklist de release

on:
  workflow_dispatch:
    inputs:
      base:
        description: "URL base a validar"
        type: string
        default: "https://tecnico.curitiba.br"
      console:
        description: "Também verificar erros de console (Playwright)"
        type: boolean
        default: true
  repository_dispatch:
    types: [site-published]
  schedule:
    - cron: "10 9 * * *"

concurrency:
  group: post-deploy-checklist
  cancel-in-progress: true

jobs:
  checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Instalar Chromium (verificação de console)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.console }}
        run: npx playwright install --with-deps chromium

      - name: Rodar checklist pós-deploy
        id: run
        run: |
          BASE="${{ inputs.base || 'https://tecnico.curitiba.br' }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.console }}" != "true" ]; then
            node scripts/checklist-post-deploy.mjs --base="$BASE"
          else
            node scripts/checklist-post-deploy.mjs --base="$BASE" --console
          fi

      - name: Publicar relatório como artefato
        id: artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-checklist-${{ github.run_number }}
          path: reports/post-deploy-checklist.md
          if-no-files-found: error
          retention-days: 90

      - name: Resumo no job
        if: always()
        run: |
          {
            echo "## Checklist pós-deploy"
            echo ""
            cat reports/post-deploy-checklist.md
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Alertas em caso de falha ──────────────────────────────────
      # Slack: configure o secret SLACK_WEBHOOK_URL (Incoming Webhook).
      # E-mail: configure SMTP_SERVER/SMTP_PORT/SMTP_USER/SMTP_PASS/ALERT_EMAIL_TO.
      # Sem os secrets, o passo é ignorado e a issue automática cobre o alerta.
      - name: Extrair falhas do relatório
        id: falhas
        if: failure()
        run: |
          FALHAS=$(sed -n '/^## Falhas/,/^## Avisos/p' reports/post-deploy-checklist.md | sed '$d')
          {
            echo "resumo<<EOF"
            echo "$FALHAS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Alerta no Slack
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ARTEFATO: ${{ steps.artefato.outputs.artifact-url }}
          RESUMO: ${{ steps.falhas.outputs.resumo }}
        run: |
          node -e '
            const url = process.env.SLACK_WEBHOOK_URL;
            const texto = [
              ":rotating_light: *Checklist pós-deploy falhou* — ${{ github.repository }}",
              process.env.RESUMO || "",
              `<${process.env.ARTEFATO}|Baixar reports/post-deploy-checklist.md>`,
              `<${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}|Ver execução>`,
            ].join("\n");
            fetch(url, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({ text: texto }),
            }).then((r) => console.log("slack:", r.status));
          '

      - name: Alerta por e-mail
        if: failure() && env.SMTP_SERVER != ''
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[tecnico.curitiba.br] Checklist pós-deploy falhou (run #${{ github.run_number }})"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: Monitoramento Técnico em Curitiba <${{ secrets.SMTP_USER }}>
          body: |
            O checklist pós-deploy identificou falhas.

            ${{ steps.falhas.outputs.resumo }}

            Relatório (artefato): ${{ steps.artefato.outputs.artifact-url }}
            Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Abrir/atualizar issue de alerta
        if: failure()
        uses: actions/github-script@v7
        env:
          ARTEFATO: ${{ steps.artefato.outputs.artifact-url }}
          RESUMO: ${{ steps.falhas.outputs.resumo }}
        with:
          script: |
            const titulo = "Checklist pós-deploy com falhas";
            const corpo = [
              `Execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Relatório: ${process.env.ARTEFATO}`,
              "",
              process.env.RESUMO || "",
            ].join("\n");
            const { data: abertas } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "post-deploy",
            });
            const existente = abertas.find((i) => i.title === titulo);
            if (existente) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existente.number, body: corpo });
            } else {
              await github.rest.issues.create({ ...context.repo, title: titulo, body: corpo, labels: ["post-deploy"] });
            }
