name: rich-results-daily

# Monitoramento diário de Rich Results (FAQPage, LocalBusiness, Service) nas
# URLs comerciais curadas. Alerta quando um tipo some, cai ou passa a ter erros.
on:
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
  GOOGLE_SEARCH_CONSOLE_API_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_API_KEY }}
  GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}

jobs:
  rich-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Rich Results (GSC)
        id: rich
        continue-on-error: true
        run: node scripts/monitor-rich-results.mjs --alert --save

      - name: Métricas de rastreamento e descoberta
        continue-on-error: true
        run: node scripts/report-crawl-metrics.mjs --env=producao --branch=${{ github.ref_name }} --commit=${{ github.sha }} --limit=80

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rich-results
          path: |
            reports/rich-results.*
            reports/crawl-metrics*.json
            reports/crawl-metrics.md

      - name: Abrir/atualizar issue em alerta de Rich Results
        if: steps.rich.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('reports/rich-results.json')
              ? JSON.parse(fs.readFileSync('reports/rich-results.json', 'utf8'))
              : null;
            const linhas = (report?.results || []).flatMap((row) =>
              (row.detalhes || []).filter((d) => d.comErro || d.comAviso || d.status !== 'ok').map((d) => {
                const sev = d.comErro ? 'ERROR' : d.comAviso ? 'WARNING' : 'REGRESSÃO';
                const url = `https://tecnico.curitiba.br${row.path}`;
                const diff = d.diff ? `antes=${d.diff.detectados.antes ?? '—'} depois=${d.diff.detectados.depois}; erros=${d.diff.erros.antes ?? '—'}→${d.diff.erros.depois}; avisos=${d.diff.avisos.antes ?? '—'}→${d.diff.avisos.depois}` : 'diff indisponível';
                return `- **${sev}** [${d.schema}](${url}) — ${diff}`;
              })
            );
            const corpo = [
              `Execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Artefato: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts`,
              '',
              '## Alertas por URL e schema',
              linhas.join('\n') || 'Relatório sem linhas detalhadas.',
              '',
              fs.existsSync('reports/rich-results.md')
              ? fs.readFileSync('reports/rich-results.md', 'utf8').slice(0, 60000)
              : 'Relatório indisponível.',
            ].join('\n');
            const titulo = 'Alerta de Rich Results — ERROR/WARNING';
            const { data: abertas } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'seo,rich-results' });
            const existente = abertas.find((i) => i.title === titulo);
            if (existente) await github.rest.issues.createComment({ ...context.repo, issue_number: existente.number, body: corpo });
            else await github.rest.issues.create({ ...context.repo, title: titulo, body: corpo, labels: ['seo', 'rich-results'] });

      - name: Alerta no Slack
        if: steps.rich.outcome == 'failure' && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node -e "const f=require('fs');const r=JSON.parse(f.readFileSync('reports/rich-results.json','utf8'));const t='Rich Results: '+r.quedas.length+' queda(s) — '+r.quedas.slice(0,5).join(' | ');f.writeFileSync('slack.json',JSON.stringify({text:t}))"
          curl -sS -X POST -H 'Content-type: application/json' --data @slack.json "$SLACK_WEBHOOK_URL"
