name: indexation-waves

on:
  schedule:
    - cron: "30 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
  GOOGLE_SEARCH_CONSOLE_API_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_API_KEY }}
  GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gerar fila de bairros
        run: npm run report:fila-bairros
      - name: Inventariar URLs elegíveis
        run: npm run report:indexation
      - name: Resumo da rodada
        run: |
          cat reports/fila-enriquecimento-bairros.md >> "$GITHUB_STEP_SUMMARY"
          node -e "const r=require('./reports/indexation-inventory.json'); console.log('## Inventário de indexação\n\n- URLs elegíveis: **'+r.total+'**\n- Erro GSC: '+(r.gscErro||'nenhum'));" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: indexation-wave-${{ github.run_number }}
          path: |
            reports/fila-enriquecimento-bairros.md
            reports/indexation-inventory.json
            reports/indexation-inventory.md
