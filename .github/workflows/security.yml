name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC re-scan to catch drift in dependencies.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Dependency audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 1) Fail the build on high/critical npm vulnerabilities.
      - name: npm audit (high+critical)
        run: |
          set -e
          bunx --bun npm audit --audit-level=high --json > audit.json || true
          node -e "const r=require('./audit.json');const m=r.metadata?.vulnerabilities||{};const bad=(m.high||0)+(m.critical||0);console.log('high:',m.high,'critical:',m.critical);if(bad>0){process.exit(1)}"

      # 2) Block secrets being committed.
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3) Static analysis on JS/TS.
      - name: Semgrep (OWASP/React rulesets)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/react

      # 4) Guard against regressions in security HTTP headers.
      - name: Verify security headers in public/_headers
        run: bun scripts/check-security-headers.ts

      # 5) Guard against tables shipping without RLS.
      - name: Verify every public-schema CREATE TABLE has RLS + GRANT
        run: bun scripts/check-rls-migrations.ts

      # 5b) Fail the build when finding SUPA_rls_policy_always_true reappears
      #     (RLS policy with a literal `true` USING / WITH CHECK predicate).
      - name: Guard SUPA_rls_policy_always_true
        run: node scripts/check-rls-always-true.mjs

      # 5c) Human-readable HTML summary of the security posture (uploaded below).
      #     Sai com código 1 quando qualquer internal_id monitorado está FOUND,
      #     bloqueando o merge (marque este job como required no branch protection).
      - name: Generate security scan HTML report (gate)
        id: security_report
        if: always()
        run: node scripts/report-security-scan.mjs

      # 5d) Notificação Slack quando qualquer internal_id monitorado é FOUND.
      - name: Notify Slack on monitored findings
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/notify-security-slack.mjs

      # 5e) Histórico versionado por commit: um artefato por execução.
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report-${{ github.sha }}-${{ github.run_number }}
          path: |
            reports/security-scan.html
            reports/security-scan-summary.json
          retention-days: 90

      - name: Fail the job when monitored findings were reported
        if: always() && steps.security_report.outcome == 'failure'
        run: |
          echo "::error::Relatório de segurança marcou internal_id(s) monitorado(s) como FOUND."
          node scripts/check-rls-always-true.mjs --explain || true
          exit 1



      # 5f) Baseline de páginas órfãs precisa estar versionado no repositório.
      - name: Verify orphan-trend baseline is committed
        run: node scripts/check-orphan-trend.mjs --assert-baseline

      # 5g) Tendência de páginas órfãs (bloqueia crescimento de órfãs indexáveis).
      - name: Orphan trend gate
        run: node scripts/check-orphan-trend.mjs

      # 5h) Controle de acesso às ferramentas MCP + auditoria privacy-first.
      - name: MCP OAuth + audit tests
        run: bunx vitest run src/lib/mcp/__tests__/mcp-auth-audit.test.ts

      # 6) Guard against SEO regressions on the landing shell (title / desc / unique H1).
      - name: Verify SEO basics on index.html
        run: bun scripts/check-seo-basics.ts index.html

      # 7) Runtime data-exposure gate — proves anon cannot read private surfaces.
      #    Runs on every PR/push and BLOCKS the merge on any regression.
      #    Uses only the public URL + publishable/anon key (safe to expose).
      - name: Public data exposure gate (anon key only)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://hisepaayuwxjrnumbqeq.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhpc2VwYWF5dXd4anJudW1icWVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MTU3NzcsImV4cCI6MjA5OTE5MTc3N30.d3ygLv0kgEFiT4hXlp6opB9mvOPLQSwSEKXuLIle164' }}
        run: node scripts/check-public-data-exposure.mjs

      # 8) Security-findings regression gate — fails if new findings appear for
      #    reviews or og_validation_status vs the committed baseline.
      - name: Security findings baseline (reviews + og_validation_status)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://hisepaayuwxjrnumbqeq.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhpc2VwYWF5dXd4anJudW1icWVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MTU3NzcsImV4cCI6MjA5OTE5MTc3N30.d3ygLv0kgEFiT4hXlp6opB9mvOPLQSwSEKXuLIle164' }}
        run: node scripts/check-security-findings-baseline.mjs

