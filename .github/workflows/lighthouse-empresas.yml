# Lighthouse CI da landing /empresas.
#
# Bloqueia merges quando performance, acessibilidade ou SEO caem abaixo dos
# limites de lighthouserc.empresas.json. O SEO agregado >=90 é exigido na página
# comercial indexável /empresa-de-ti-curitiba. /empresas mantém todos os audits
# SEO aplicáveis individualmente; seu noindex/canonical deliberados são gates
# E2E no mesmo job. Performance, LCP e acessibilidade preservam os mesmos limites
# nas duas URLs. O status de JSON-LD (Service + FAQPage)
# é validado pelos specs Playwright de /empresas, executados no mesmo job — o
# JSON-LD é injetado na hidratação e o Lighthouse não o audita de forma dura.
name: lighthouse-empresas

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lighthouse-empresas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Conferir Chrome Stable do runner
        run: google-chrome --version

      - name: Iniciar preview para testes
        run: |
          node scripts/preview-built.mjs --port 8080 --strictPort > /tmp/tecnico-preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/ && exit 0; sleep 1; done
          cat /tmp/tecnico-preview.log
          exit 1

      - name: JSON-LD, CTAs e dedupe da /empresas (E2E)
        run: npx playwright test --config=playwright.ci.config.ts e2e/empresas-landing.spec.ts e2e/empresas-mobile-ctas.spec.ts e2e/problema-ssr-regression.spec.ts e2e/lighthouse-indexability.spec.ts
        env:
          PW_CHANNEL: chrome

      - name: Lighthouse CI (/empresas, mobile)
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.empresas.json

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-empresas-${{ github.run_number }}
          path: |
            .lighthouseci-empresas
            playwright-report
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
