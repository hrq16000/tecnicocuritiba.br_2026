name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Restore ESLint cache
        uses: actions/cache@v4
        with:
          path: .cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.js', 'package-lock.json') }}-
            eslint-${{ runner.os }}-
      - name: Lint (cache incremental, non-blocking warnings)
        run: npm run lint:ci --silent || echo "::warning::lint reported issues"
      - name: Gate de Motion Principles (skeleton, lazyload, progresso)
        run: npm run check:motion-coverage
      - name: CTA funnel gate
        run: npm run check:cta-funnel
      - name: Internal links + sitemap gate
        run: npm run check:internal-links
      - name: JSON-LD sem verticais recusadas (Service[])
        run: npm run check:service-offerings
      - name: Orphan page components gate
        run: npm run check:orphan-pages

      - name: Cannibalization gate (P0)
        run: npm run check:cannibalization
      - name: Local hierarchy gate (bairros/cidades)
        run: npm run check:local-hierarchy
      - name: Gate de copy proibido (CNPJ, razão social, e-mail, telefone, "orçamento")
        run: npm run check:forbidden-copy
      - name: Gate "sem balcão" (só coleta e entrega)
        run: npm run check:sem-balcao
      - name: Gate de claims de confiança
        run: npm run check:trust-claims
      - name: Gate de cluster editorial e interlinking (Rodada 4F)
        run: npm run check:editorial-cluster
      - name: Inventário editorial
        run: npm run report:editorial

      - name: Build
        run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_OTEL_ENDPOINT: ${{ secrets.VITE_OTEL_ENDPOINT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      - name: Gate de WhatsApp oculto no HTML renderizado
        run: npm run check:wa-number-dom
      - name: Gate de alt text das imagens (sem alt genérico/placeholder)
        run: npm run check:image-alt
      - name: Gate de privacidade das fotos reais (EXIF/GPS)
        run: npm run check:photos
      - name: Gate de LocalBusiness unificado no cluster de informática
        run: npm run check:localbusiness-cluster
      - name: JSON-LD validation
        run: npm run validate:jsonld
      - name: JSON-LD gate das 4 páginas P0
        run: npm run check:jsonld-p0
      - name: Gate de rich results (LocalBusiness/Service/FAQPage)
        run: npm run check:rich-results:strict
      - name: Paridade JSON-LD × conteúdo visível (FAQPage/Offer/LocalBusiness)
        run: npm run check:jsonld-parity
      - name: BreadcrumbList serviço × cidade
        run: npm run check:breadcrumb-schema
      - name: Markup de preço (Offer/PriceSpecification)
        run: npm run check:price-schema
      - name: Paridade 1:1 FAQPage × FAQ visível
        run: npm run check:faq-parity
      - name: Unicidade de title/description (serviço × cidade e blog)
        run: npm run check:meta-uniqueness
      - name: Image sitemap (geração + integridade)
        run: npm run sitemap:images && npm run check:image-sitemap
      - name: Licenças e créditos das fotos públicas
        run: npm run check:image-credits
      - name: Relatório público de paridade de FAQ (CSV/MD)
        run: npm run report:faq-parity


      - name: SEO estático das rotas comerciais (canonical/og:url/og:site_name)
        run: |
          npx vite preview --port 4325 --strictPort &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4325/ && break; sleep 1; done
          E2E_BASE_URL=http://localhost:4325 npx playwright test --config=playwright.ci.config.ts e2e/comercial-og-canonical.spec.ts --reporter=line
      - name: Changelog de SEO do build (headings, metadados, structured data)
        run: npm run report:seo-changelog
      - name: Upload changelog de SEO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-changelog
          path: |
            reports/seo-changelog.md
            reports/seo-changelog.json
      # Rede: valida as rotas curadas em produção (301/308, cadeias, 404, loops)
      # antes de promover o build. Só roda em push na main.
      - name: Gate de redirects das rotas curadas (produção)
        if: github.event_name == 'push'
        run: npm run check:redirects:curated

      - name: Paridade de analytics (GA4 x click_events x relatorio)
        run: npm run check:analytics-parity
      - name: Interlinking local gate (mãe ⇄ bairros/cidades)
        run: npm run check:local-interlinking
      - name: E-E-A-T coverage gate
        run: npm run check:eeat
      # Gate de indexação: serve o build e valida status, content-type,
      # canonical self-referente, robots e JSON-LD de cada rota do sitemap,
      # além de garantir que nenhum alias 301 tenha canonical próprio.
      - name: Gate de saúde de indexação (rotas + aliases)
        run: |
          npx vite preview --port 4321 --strictPort &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:4321/ && break; sleep 1; done
          node scripts/check-index-health.mjs --base=http://localhost:4321 --strict
      # Originalidade: mede o DOM renderizado de TODA URL curada, exige corpo
      # autoral mínimo por família e bloqueia duplicidade (Jaccard de shingles).
      # Escreve reports/content-approval.json, consumido pelo gerador de sitemap.
      - name: Gate de originalidade de conteúdo (Jaccard + corpo mínimo)
        run: |
          npx playwright install --with-deps chromium
          npm run check:originality
      - name: Upload relatório de originalidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: originality-report
          path: |
            reports/originality.json
            reports/content-approval.json
          retention-days: 30
      - name: Controle de ondas Wi-Fi/TV (4–6/semana + prova visual)
        run: npm run check:waves
      - name: Relatório HTML de auditoria local
        run: npm run report:local-audit

      - name: Upload relatório de auditoria local
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-audit-report
          path: reports/local-audit.html
          retention-days: 30

  unit:
    name: unit + integration (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Typecheck (gate obrigatório)
        run: npm run check:types
      - name: Testes unit/integração com cobertura
        run: npm run test:coverage
      - name: Upload cobertura para o Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit
          name: unit-integration
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start preview
        run: npx vite preview --port 8080 &
        env:
          CI: "true"
      - name: Wait for server
        run: npx wait-on http://localhost:8080 --timeout 60000
      - name: Run targeted E2E (whatsapp + termos + sitemap + como-funciona + segurança)
        run: npx playwright test e2e/whatsapp-funnel.spec.ts e2e/termos-e-condicoes.spec.ts e2e/seo-sitemap-robots.spec.ts e2e/como-funciona-mobile.spec.ts e2e/security-data-exposure.spec.ts
        env:
          E2E_BASE_URL: http://localhost:8080
          # Chaves públicas (anon) — o teste também tem fallback embutido.
          E2E_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Opcional: credenciais de um usuário de teste NÃO-admin (segredos de CI).
          # Se ausentes, o bloco autenticado é pulado (o bloco anon sempre roda).
          E2E_NONADMIN_EMAIL: ${{ secrets.E2E_NONADMIN_EMAIL }}
          E2E_NONADMIN_PASSWORD: ${{ secrets.E2E_NONADMIN_PASSWORD }}
      - name: Acessibilidade axe-core (páginas empresariais 3T/3U)
        run: npx playwright test e2e/a11y-empresarial.spec.ts
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Upload resultados E2E para o Codecov (test analytics)
        if: always()
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: e2e


  e2e-full-matrix:
    # Suíte completa por navegador, PARTICIONADA em shards oficiais do Playwright.
    # OBSERVACIONAL: registra o baseline de cada engine sem bloquear o merge —
    # o gate bloqueante continua sendo o job `e2e`.
    name: e2e ${{ matrix.browser }} shard ${{ matrix.shard }}/${{ matrix.totalShards }} (observacional)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
        totalShards: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser (${{ matrix.browser }})
        # Instalação oficial com dependências de sistema — sem LD_LIBRARY_PATH custom.
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build (uma única vez por job)
        run: npm run build
      - name: Start preview
        run: npx vite preview --port 8080 &
      - name: Wait for server (healthcheck HTTP)
        run: npx wait-on http-get://localhost:8080/ --timeout 90000
      - name: Run shard ${{ matrix.shard }}/${{ matrix.totalShards }} (${{ matrix.browser }})
        run: npx playwright test --config=playwright.ci.config.ts --shard=${{ matrix.shard }}/${{ matrix.totalShards }}
        env:
          PW_BROWSER: ${{ matrix.browser }}
          PW_REPORT_MODE: blob
          PW_SHARD_TAG: ${{ matrix.shard }}
          E2E_BASE_URL: http://localhost:8080
          E2E_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Rerun seletivo apenas das specs que falharam (evidência de flakiness)
        # Não substitui o resultado original: gera blob separado, claramente rotulado.
        if: failure()
        run: npx playwright test --config=playwright.ci.config.ts --last-failed
        continue-on-error: true
        env:
          PW_BROWSER: ${{ matrix.browser }}
          PW_REPORT_MODE: blob
          PW_SHARD_TAG: ${{ matrix.shard }}-rerun
          E2E_BASE_URL: http://localhost:8080
          E2E_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Upload blob report (${{ matrix.browser }}-${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload traces/screenshots (${{ matrix.browser }}-${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-matrix-report:
    # Consolida os blobs de todos os shards/engines. Roda mesmo com shards falhando,
    # mas NÃO converte falha em sucesso: o relatório mostra o resultado real.
    name: e2e matriz — relatório consolidado (observacional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: e2e-full-matrix
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          merge-multiple: true
          path: all-blob-reports
      - name: Merge into HTML
        run: npx playwright merge-reports --reporter html ./all-blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: merged-report/html
      - name: Merge into JSON
        run: mkdir -p merged-report && npx playwright merge-reports --reporter json ./all-blob-reports > merged-report/results.json
      - name: Consolidar, deduplicar e classificar falhas
        run: node scripts/consolidate-e2e-failures.mjs merged-report/results.json --out merged-report/inventario-falhas.md
      - name: Resumo por navegador
        if: always()
        run: cat merged-report/inventario-falhas.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload relatório consolidado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-consolidado
          path: merged-report/
          retention-days: 14


  indexnow:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect changes in service/neighborhood pages
        id: changes
        run: |
          set -e
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          changed=$(git diff --name-only "$base" HEAD || true)
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/pages/(servicos|bairros|arrumar-pc|servico-bairro|cftv|hubs)/|src/pages/Tecnico|src/pages/Conserto|src/pages/EmpresaDeTiCuritiba|src/lib/servicos(Core|Local)|public/sitemap)'; then
            echo "ping=true" >> "$GITHUB_OUTPUT"
          else
            echo "ping=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem mudanças em páginas de serviço/bairro/sitemap — IndexNow pulado."
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.ping == 'true'
        with:
          node-version: "20"
      - name: Ping IndexNow with sitemap URLs
        if: steps.changes.outputs.ping == 'true'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_HOST: tecnico.curitiba.br
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::warning::INDEXNOW_KEY ausente — pulando ping."
            exit 0
          fi
          node scripts/indexnow-ping.mjs

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Install Lighthouse CI
        run: npm i -g @lhci/cli@0.13.x
      - name: Build
        run: npm run build
      - name: Lighthouse desktop (bloqueante)
        run: npm run lh:desktop
      - name: Lighthouse mobile (bloqueante)
        run: npm run lh:mobile
      - name: Resumo Lighthouse (LCP/CLS/TTFB/A11y)
        if: always()
        run: node scripts/report-lighthouse-summary.mjs
      - name: Budgets de performance (FCP/LCP/CLS/TTFB/A11y)
        run: node scripts/check-performance-budgets.mjs
      - name: Upload resumo Lighthouse
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-summary
          path: reports/lighthouse-summary.*
          if-no-files-found: ignore
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore


